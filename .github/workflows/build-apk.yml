name: Build SurveyQuant APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project ZIP
        run: |
          curl -L "https://github.com/aboabdalla72229-hash/SurveyQuantAndroid/raw/main/SurveyQuantAndroid_V33_RAILWAY_PAYMENT_READY.zip" -o project.zip
          mkdir project
          unzip -q project.zip -d project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

      - name: Find Android project
        run: |
          echo "Searching..."
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -o -name settings.gradle.kts | head -1)")
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "ERROR: gradlew not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurveyQuant-V33-APK
          path: 'project/**/build/outputs/apk/debug/*.apk'
